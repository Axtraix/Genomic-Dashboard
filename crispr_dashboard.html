<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div>
        <div>
            <div>
                <!-- Raw API data will render here -->
                <pre id="api-data"></pre>
            </div>
        </div>
    </div>

    <script>
        const url = "https://clinicaltrials.gov/api/v2/studies?query.cond=Diabetes&filter.overallStatus=RECRUITING&pageSize=5";

        fetch(url)
            .then(response => response.json())
            .then(data => {
                // Print the unformatted raw text directly on screen
                document.getElementById('api-data').innerText = JSON.stringify(data);
            })
            .catch(error => {
                document.getElementById('api-data').innerText = "Error loading data: " + error;
            });
    </script>
</body>
</html>
