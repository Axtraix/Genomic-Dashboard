<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Trials & Gene Patent Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light p-4">

  <div class="container-fluid">
    <h2 class="mb-4">Clinical Trials & IP Saturation Dashboard</h2>

    <!-- Analytics Chart Section -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">
        Gene Target Analytics: Patents vs. Clinical Trials
      </div>
      <div class="card-body" style="position: relative; height: 350px;">
        <canvas id="geneChart"></canvas>
      </div>
    </div>
    
    <!-- Controls -->
    <div class="row mb-3">
      <div class="col-md-6 mb-2">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by NCT ID, Title, Gene, or Sponsor...">
      </div>
      <div class="col-md-4 mb-2">
        <select id="geneFilter" class="form-select">
          <option value="">All Gene Targets</option>
          <option value="PCSK9">PCSK9</option>
          <option value="HTT">HTT</option>
          <option value="HBB">HBB</option>
          <option value="TTR">TTR</option>
          <option value="ANGPTL3">ANGPTL3</option>
          <option value="DNMT1">DNMT1</option>
          <option value="CFTR">CFTR</option>
          <option value="BRCA1">BRCA1</option>
          <option value="EGFR">EGFR</option>
          <option value="INS">INS</option>
          <option value="INSR">INSR</option>
        </select>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle text-center" id="trialsTable">
        <thead class="table-dark">
          <tr>
            <th>NCT ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Primary Gene Target</th>
            <th>Europe PMC Patents</th>
            <th>IP Saturation Index</th>
            <th>Conditions</th>
            <th>Sponsor</th>
          </tr>
        </thead>
        <tbody id="trials-body">
          <tr>
            <td colspan="8" class="text-center">Loading studies from server...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
