<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Trials Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container-fluid">
    <h2 class="mb-4">Clinical Trials Dashboard</h2>
    <!--jfjfjfjfj-->
    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>NCT ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Conditions</th>
            <th>Interventions</th>
            <th>Sponsor</th>
            <th>Locations</th>
            <th>Dates</th>
          </tr>
        </thead>
        <tbody id="trials-table-body">
          <tr>
            <td colspan="8" class="text-center">Loading study data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const url = "https://clinicaltrials.gov/api/v2/studies?query.cond=Diabetes&filter.overallStatus=RECRUITING&pageSize=5";

    fetch(url)
      .then(response => response.json())
      .then(data => {
        const tableBody = document.getElementById('trials-table-body');
        tableBody.innerHTML = ''; // Clear loading row

        data.studies.forEach(study => {
          const protocol = study.protocolSection || {};

          // Extract fields with fallbacks for missing data
          const nctId = protocol.identificationModule?.nctId || 'N/A';
          const title = protocol.identificationModule?.briefTitle || 'N/A';
          const status = protocol.statusModule?.overallStatus || 'N/A';
          
          const conditions = protocol.conditionsModule?.conditions?.join(', ') || 'N/A';
          
          const interventions = protocol.armsInterventionsModule?.interventions
            ?.map(i => `${i.type}: ${i.name}`)
            .join('<br>') || 'N/A';

          const sponsor = protocol.sponsorCollaboratorsModule?.leadSponsor?.name || 'N/A';

          const locations = protocol.contactsLocationsModule?.locations
            ?.map(loc => `${loc.facility || ''} (${loc.city || ''}, ${loc.country || ''})`)
            .filter(loc => loc.trim() !== '()')
            .slice(0, 2) // Limit display count per row for readability
            .join('<br>') || 'N/A';

          const startDate = protocol.statusModule?.startDateStruct?.date || 'N/A';
          const completionDate = protocol.statusModule?.completionDateStruct?.date || 'N/A';

          // Build table row
          const row = `
            <tr>
              <td style="text-align: center;"><strong>${nctId}</strong></td>
              <td style="text-align: center;">${title}</td>
              <td style="text-align: center;"><span class="badge bg-success">${status}</span></td>
              <td style="text-align: center; vertical-align: top;">${conditions}</td>
              <td style="text-align: center;"><small>${interventions}</small></td>
              <td style="text-align: center;">${sponsor}</td>
              <td style="text-align: center;"><small>${locations}</small></td>
              <td style="text-align: center;"><small>Start: ${startDate}<br>End: ${completionDate}</small></td>
            </tr>
          `;
          
          tableBody.innerHTML += row;
        });
      })
      .catch(error => {
        document.getElementById('trials-table-body').innerHTML = `
          <tr>
            <td colspan="8" class="text-danger text-center">Error loading data: ${error}</td>
          </tr>`;
      });
  </script>
</body>
</html>
