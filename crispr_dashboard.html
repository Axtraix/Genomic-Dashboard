<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Trials & Gene Patent Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container-fluid">
    <h2 class="mb-4">Clinical Trials & Gene Patent Dashboard</h2>
    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle text-center">
        <thead class="table-dark">
          <tr>
            <th>NCT ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Detected Genes</th>
            <th>Patent Count (Europe PMC)</th>
            <th>Conditions</th>
            <th>Interventions</th>
            <th>Sponsor</th>
          </tr>
        </thead>
        <tbody id="trials-table-body">
          <tr>
            <td colspan="8" class="text-center">Loading study data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Known gene target reference list for regex filtering
    const KNOWN_GENES = new Set(["PCSK9", "HTT", "HBB", "TTR", "ANGPTL3", "DNMT1", "CFTR", "BRCA1", "EGFR", "INS", "INSR"]);

    // Function to parse target gene symbols from study text
    function extractGeneSymbols(text) {
      if (!text) return [];
      const regex = /\b[A-Z][A-Z0-9]{1,7}\b/g;
      const matches = text.match(regex) || [];
      const foundGenes = matches.filter(gene => KNOWN_GENES.has(gene));
      return [...new Set(foundGenes)];
    }

    // Function to query Europe PMC API for patent counts associated with a gene
    async function fetchPatentCount(geneSymbol) {
      const queryStr = `SRC:PAT AND ("CRISPR" OR "Gene Editing") AND "${geneSymbol}"`;
      const url = `https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=${encodeURIComponent(queryStr)}&format=json&pageSize=1`;
      
      try {
        const res = await fetch(url);
        if (!res.ok) return 0;
        const data = await res.json();
        return data.hitCount || 0;
      } catch (err) {
        console.error(`Error fetching patents for ${geneSymbol}:`, err);
        return 0;
      }
    }

    // Primary fetch set to retrieve 50 records
    const url = "https://clinicaltrials.gov/api/v2/studies?query.cond=Diabetes&filter.overallStatus=RECRUITING&pageSize=50";

    fetch(url)
      .then(response => response.json())
      .then(async data => {
        const tableBody = document.getElementById('trials-table-body');
        tableBody.innerHTML = ''; // Clear loading row

        const studies = data.studies || [];

        for (const study of studies) {
          const protocol = study.protocolSection || {};

          const nctId = protocol.identificationModule?.nctId || 'N/A';
          const title = protocol.identificationModule?.briefTitle || 'N/A';
          const status = protocol.statusModule?.overallStatus || 'N/A';
          const summary = protocol.descriptionModule?.briefSummary || '';
          
          const combinedText = `${title} ${summary}`;
          const detectedGenes = extractGeneSymbols(combinedText);
          
          let geneDisplay = 'None';
          let patentDisplay = 'N/A';

          if (detectedGenes.length > 0) {
            geneDisplay = detectedGenes.map(g => `<span class="badge bg-primary me-1">${g}</span>`).join('');
            
            // Fetch patent count for the first detected gene target
            const patentCount = await fetchPatentCount(detectedGenes[0]);
            patentDisplay = `<span class="badge bg-info text-dark">${patentCount} patents</span>`;
          }

          const conditions = protocol.conditionsModule?.conditions?.join(', ') || 'N/A';
          const interventions = protocol.armsInterventionsModule?.interventions
            ?.map(i => `${i.type}: ${i.name}`)
            .join('<br>') || 'N/A';
          const sponsor = protocol.sponsorCollaboratorsModule?.leadSponsor?.name || 'N/A';

          const row = `
            <tr>
              <td><strong>${nctId}</strong></td>
              <td class="text-start">${title}</td>
              <td><span class="badge bg-success">${status}</span></td>
              <td>${geneDisplay}</td>
              <td>${patentDisplay}</td>
              <td><small>${conditions}</small></td>
              <td><small>${interventions}</small></td>
              <td><small>${sponsor}</small></td>
            </tr>
          `;
          
          tableBody.insertAdjacentHTML('beforeend', row);
        }
      })
      .catch(error => {
        document.getElementById('trials-table-body').innerHTML = `
          <tr>
            <td colspan="8" class="text-danger text-center">Error loading data: ${error}</td>
          </tr>`;
      });
  </script>
</body>
</html>
