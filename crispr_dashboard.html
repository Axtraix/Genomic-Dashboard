<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Trials & Gene Patent Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light p-4">

  <div class="container-fluid">
    <h2 class="mb-4">Clinical Trials & IP Saturation Dashboard</h2>

    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">
        Gene Target Analytics: Patents vs. Clinical Trials
      </div>
      <div class="card-body" style="position: relative; height: 350px;">
        <canvas id="geneChart"></canvas>
      </div>
    </div>
    
    <div class="row mb-3">
      <div class="col-md-6 mb-2">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by NCT ID, Title, Gene, or Sponsor...">
      </div>
      <div class="col-md-4 mb-2">
        <select id="geneFilter" class="form-select">
          <option value="">All Gene Targets</option>
          <option value="PCSK9">PCSK9</option>
          <option value="HTT">HTT</option>
          <option value="HBB">HBB</option>
          <option value="TTR">TTR</option>
          <option value="ANGPTL3">ANGPTL3</option>
          <option value="DNMT1">DNMT1</option>
          <option value="CFTR">CFTR</option>
          <option value="BRCA1">BRCA1</option>
          <option value="EGFR">EGFR</option>
          <option value="INS">INS</option>
          <option value="INSR">INSR</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle text-center" id="trialsTable">
        <thead class="table-dark">
          <tr>
            <th>NCT ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Primary Gene Target</th>
            <th>Europe PMC Patents</th>
            <th>IP Saturation Index</th>
            <th>Conditions</th>
            <th>Sponsor</th>
          </tr>
        </thead>
        <tbody id="trials-body">
          <tr>
            <td colspan="8" class="text-center">Loading studies from server...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let allData = [];
      let geneChart = null;
      const KNOWN_GENES = ["PCSK9", "HTT", "HBB", "TTR", "ANGPTL3", "DNMT1", "CFTR", "BRCA1", "EGFR", "INS", "INSR"];

      function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function extractGene(text) {
        if (!text) return 'None';
        for (const gene of KNOWN_GENES) {
          if (new RegExp(`\\b${gene}\\b`, 'i').test(text)) return gene;
        }
        return 'None';
      }

      async function fetchDirectFromAPIs() {
        try {
          const response = await fetch('https://clinicaltrials.gov/api/v2/studies?query.cond=Diabetes&filter.overallStatus=RECRUITING&pageSize=25');
          const json = await response.json();
          const rawStudies = json.studies || [];

          allData = rawStudies.map(s => {
            const protocol = s.protocolSection || {};
            const idMod = protocol.identificationModule || {};
            const statusMod = protocol.statusModule || {};
            const descMod = protocol.descriptionModule || {};
            const condMod = protocol.conditionsModule || {};
            const sponsorMod = protocol.sponsorCollaboratorsModule || {};

            const title = idMod.briefTitle || 'N/A';
            const summary = descMod.briefSummary || '';
            const detectedGene = extractGene(`${title} ${summary}`);

            return {
              nct_id: idMod.nctId || 'N/A',
              title: title,
              status: statusMod.overallStatus || 'N/A',
              primary_gene: detectedGene,
              patent_count: Math.floor(Math.random() * 200), // Placeholder mock counts for client-only execution
              ip_index_label: 'Active',
              conditions: (condMod.conditions || []).join(', '),
              sponsor: (sponsorMod.leadSponsor || {}).name || 'N/A'
            };
          });

          renderDashboard(allData);
        } catch (err) {
          console.error(err);
          document.getElementById('trials-body').innerHTML = `<tr><td colspan="8" class="text-danger">Failed to fetch data directly from API.</td></tr>`;
        }
      }

      function renderDashboard(data) {
        renderTable(data);
        renderChart(data);
      }

      function renderTable(data) {
        const tbody = document.getElementById('trials-body');
        if (!data.length) {
          tbody.innerHTML = `<tr><td colspan="8">No studies found.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(item => `
          <tr>
            <td><a href="https://clinicaltrials.gov/study/${encodeURIComponent(item.nct_id)}" target="_blank">${escapeHTML(item.nct_id)}</a></td>
            <td class="text-start">${escapeHTML(item.title)}</td>
            <td><span class="badge bg-success">${escapeHTML(item.status)}</span></td>
            <td><span class="badge bg-primary">${escapeHTML(item.primary_gene)}</span></td>
            <td>${item.patent_count}</td>
            <td>${escapeHTML(item.ip_index_label)}</td>
            <td>${escapeHTML(item.conditions)}</td>
            <td>${escapeHTML(item.sponsor)}</td>
          </tr>
        `).join('');
      }

      function renderChart(data) {
        const ctx = document.getElementById('geneChart').getContext('2d');
        const aggregates = data.reduce((acc, item) => {
          const gene = item.primary_gene;
          acc[gene] = acc[gene] || { trials: 0, patents: item.patent_count };
          acc[gene].trials += 1;
          return acc;
        }, {});

        const labels = Object.keys(aggregates);
        if (geneChart) geneChart.destroy();

        geneChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              { label: 'Clinical Trials', data: labels.map(g => aggregates[g].trials), backgroundColor: 'rgba(13, 110, 253, 0.7)' },
              { label: 'Patents', data: labels.map(g => aggregates[g].patents), backgroundColor: 'rgba(220, 53, 69, 0.7)' }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        renderDashboard(allData.filter(d => d.title.toLowerCase().includes(val) || d.nct_id.toLowerCase().includes(val)));
      });

      document.getElementById('geneFilter').addEventListener('change', (e) => {
        const val = e.target.value;
        renderDashboard(val ? allData.filter(d => d.primary_gene === val) : allData);
      });

      fetchDirectFromAPIs();
    });
  </script>
</body>
</html>
